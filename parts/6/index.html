<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarShip 6 — Täisväärtuslik mäng</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 24px 12px; background: #070b19; color: #e4f7ff; font: 16px monospace; }
    main { max-width: 800px; margin: auto; }
    h1 { color: #73eed8; font-size: 24px; }
    canvas { display: block; width: 100%; height: auto; background: #080d22; border: 1px solid #334364; image-rendering: pixelated; }
    p { line-height: 1.8; }
    a { color: #73eed8; }
    button { padding: 12px 20px; font: inherit; cursor: pointer; }
  </style>
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <h1>StarShip 6 — Täisväärtuslik mäng</h1>
    <canvas id="game" width="800" height="600" aria-label="StarShip 6">Brauser peab toetama HTML5 Canvas-elementi.</canvas>
    <p>← → või A D — liikumine · Tühik — tulistamine · P — paus · Enter — uus katse pärast mängu lõppu</p>
    <button id="restart" type="button" hidden>Uus katse</button>
    <p><a href="../../index.html">Lõppversioon</a></p>
  </main>

</html>
